<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080C}
a{color:#ECEEF3}a:hover{color:#FFFFFF}
.nav:hover{background:rgba(255,255,255,0.05)}
.tp .art{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tp:hover .art{transform:translateY(-6px) scale(1.04)}
.yr:hover{background:rgba(255,255,255,0.05)}
</style>
</helmet>
<div style="min-height: 100vh; background: #07080C; color: #ECEEF3; font-family: Geist, 'Segoe UI', system-ui, sans-serif; display: flex; flex-wrap: wrap; position: relative; overflow: hidden">

  <nav aria-label="Primary" style="flex: 1 1 220px; max-width: 100%; display: flex; flex-direction: column; gap: 28px; padding: 28px 18px; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.07); position: relative">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
      <div style="width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid {{accent}}; display: grid; place-items: center; box-sizing: border-box"><div style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 12px {{accent}}"></div></div>
      <span style="font-family: Unbounded, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0.02em">Reel</span>
    </div>
    <a href="Search.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #A3A9B6; text-decoration: none; font-size: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="flex: 1; white-space: nowrap">Search</span>
      <kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #A3A9B6; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 2px 6px">Ctrl K</kbd>
    </a>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a class="nav" href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #A3A9B6; text-decoration: none; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="10" rx="1.5"></rect><rect x="14" y="3" width="7" height="10" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect><rect x="14" y="16" width="7" height="5" rx="1.5"></rect></svg>
        <span>Library</span>
      </a>
      <a href="Timeline.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.08); color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18"></path><circle cx="7" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><path d="M7 5v3M16 16v3M12 5v3"></path></svg>
        <span style="flex: 1">Timeline</span><span style="width: 6px; height: 6px; border-radius: 50%; background: {{accent}}"></span>
      </a>
      <a class="nav" href="Stats.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #A3A9B6; text-decoration: none; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"></path></svg>
        <span>Stats</span>
      </a>
      <a class="nav" href="ForYou.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #A3A9B6; text-decoration: none; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"></path></svg>
        <span>For you</span>
      </a>
      <a class="nav" href="TasteMap.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #A3A9B6; text-decoration: none; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="6" cy="7" r="2"></circle><circle cx="17" cy="6" r="1.5"></circle><circle cx="10" cy="16" r="2.5"></circle><circle cx="18.5" cy="16.5" r="1.5"></circle></svg>
        <span>Taste map</span>
      </a>
    </div>
    <p style="margin: auto 0 0; padding: 0 10px; font-size: 11px; line-height: 1.5; color: #8E95A3">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 36px 0 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">
    <header style="padding: 0 48px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.01em">{{year}}</h1>
        <p style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 13px; color: #9AA1AE">{{yearSummary}}</p>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="Previous year" onClick="{{prev}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #ECEEF3; display: grid; place-items: center; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <button type="button" aria-label="Next year" onClick="{{next}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #ECEEF3; display: grid; place-items: center; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </header>

    <section aria-label="Watches by month" style="overflow-x: auto; padding: 0 48px 12px">
      <div style="display: flex; gap: 0; width: max-content; position: relative">
        <sc-for list="{{months}}" as="m" hint-placeholder-count="12">
          <div style="display: flex; flex-direction: column; gap: 18px; padding: 0 28px 0 0; min-width: 120px; opacity: {{m.opacity}}">
            <div style="display: flex; flex-direction: column; gap: 4px; padding-left: 2px">
              <span style="font-family: Unbounded, sans-serif; font-weight: 500; font-size: 20px">{{m.name}}</span>
              <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #8E95A3">{{m.summary}}</span>
            </div>
            <div style="position: relative; height: 14px">
              <div style="position: absolute; left: 0; right: -28px; top: 6px; height: 2px; background: rgba(255,255,255,0.1)"></div>
              <div style="position: absolute; left: 0; top: 0; width: 2px; height: 14px; background: rgba(255,255,255,0.28)"></div>
              <sc-if value="{{m.isNow}}" hint-placeholder-val="{{ false }}">
                <div style="position: absolute; left: 30px; top: -4px; display: flex; align-items: center; gap: 6px">
                  <span style="width: 10px; height: 10px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 14px {{accent}}"></span>
                  <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{accent}}">TODAY</span>
                </div>
              </sc-if>
            </div>
            <div style="display: flex; gap: 14px; align-items: flex-start">
              <sc-for list="{{m.films}}" as="f" hint-placeholder-count="2">
                <a class="tp" href="Detail.dc.html" style="display: flex; flex-direction: column; gap: 8px; width: 112px; text-decoration: none; color: inherit">
                  <div class="art" style="position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; background: {{f.bg}}; box-shadow: 0 20px 36px -18px {{f.bg}}">
                    <span style="font-family: Unbounded, sans-serif; font-weight: 600; font-size: 12px; line-height: 1.15; color: {{f.fg}}">{{f.title}}</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 12px">
                    <span style="color: #ECEEF3">{{f.day}}</span>
                    <span style="color: #E6E1C8">★ {{f.rating}}</span>
                  </div>
                </a>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-label="All years" style="margin: 0 48px; padding: 26px; border-radius: 22px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); backdrop-filter: blur(24px); display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 14px">
        <h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 500; font-size: 18px">Every year</h2>
        <div style="display: flex; gap: 18px; font-size: 12px; color: #A3A9B6">
          <span style="display: flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 3px; background: {{accent}}"></span>exact day</span>
          <span style="display: flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 3px; box-sizing: border-box; border: 1.5px dashed {{accent}}"></span>month or year only</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 8px; align-items: end; min-width: 0">
        <sc-for list="{{years}}" as="y" hint-placeholder-count="13">
          <button type="button" class="yr" aria-pressed="{{y.pressed}}" aria-label="{{y.aria}}" onClick="{{y.pick}}" style="display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 4px; border-radius: 12px; font: inherit; color: inherit; cursor: pointer; border: 1px solid {{y.border}}; background: {{y.bg}}">
            <span style="font-family: 'Geist Mono', monospace; font-size: 11px; text-align: center; color: #C9CDD6">{{y.total}}</span>
            <span style="display: flex; flex-direction: column; justify-content: flex-end; height: 140px; gap: 2px">
              <span style="border-radius: 4px 4px 0 0; box-sizing: border-box; border: 1.5px dashed {{y.dash}}; height: {{y.approxH}}px"></span>
              <span style="border-radius: 2px; height: {{y.exactH}}px; background: {{y.fill}}"></span>
            </span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 12px; text-align: center">{{y.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7FDBFF","options":["#7FDBFF","#C6F36B","#FFB86B","#C9A7FF"]},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { year: 2026 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#7FDBFF';
    const F = (title, day, rating, bg, fg, min) => ({ title, day, rating: rating.toFixed(1), bg, fg, min });
    const m2026 = [
      ['January', [F('Stalker', 'Jan 12', 5, '#5C6640', '#EDE8D0', 162), F('Interstellar', 'Jan 27', 4.5, '#CFC8B8', '#191714', 169)]],
      ['February', [F('A Separation', 'Feb 8', 5, '#6B5B4B', '#F4EDE2', 123)]],
      ['March', [F('Moonlight', 'Mar 1', 4, '#2E3F94', '#F2C9D9', 111), F('Her', 'Mar 19', 4, '#E06A55', '#2A0E0A', 126)]],
      ['April', [F('Spirited Away', 'Apr 5', 4.5, '#3F7F96', '#F3E7C9', 125)]],
      ['May', [F('Parasite', 'May 17', 4.5, '#2E3A33', '#E9E3D2', 132), F('Drive', 'May 30', 3.5, '#E35A9B', '#1A0A12', 100)]],
      ['June', [F('Oppenheimer', 'Jun 14', 4, '#1A1210', '#F07A32', 180)]],
      ['July', [F('Portrait of a Lady on Fire', 'Jul 2', 4.5, '#C9572A', '#1D0E07', 122), F('Mad Max: Fury Road', 'Jul 21', 4, '#E8A33D', '#1E1205', 120)]],
      ['August', [F('Aftersun', 'Aug 9', 4, '#6FB3CF', '#0E2230', 102), F('Arrival', 'Aug 23', 4.5, '#B9BFC0', '#1C2326', 116)]],
      ['September', [F('In the Mood for Love', 'Sep 6', 5, '#8E1A1F', '#F4D9B8', 98), F('Dune: Part Two', 'Sep 20', 4.5, '#C46A2F', '#1B0D05', 166), F('Past Lives', 'Sep 28', 4.5, '#233A57', '#F0C9A8', 106)]],
      ['October', [F('Perfect Days', 'Oct 3', 4.5, '#2F5A4C', '#F1E6C8', 124)]],
      ['November', []],
      ['December', []]
    ];
    const months = m2026.map(([name, films], i) => {
      const mins = films.reduce((a, f) => a + f.min, 0);
      return {
        name, films,
        isNow: i === 9,
        opacity: i > 9 ? '0.35' : '1',
        summary: films.length ? films.length + (films.length === 1 ? ' film · ' : ' films · ') + (mins / 60).toFixed(1) + ' h' : 'nothing yet'
      };
    });
    const ydata = [[2014, 23, 20], [2015, 31, 18], [2016, 26, 12], [2017, 29, 9], [2018, 33, 10], [2019, 40, 9], [2020, 51, 12], [2021, 49, 7], [2022, 44, 3], [2023, 44, 1], [2024, 47, 0], [2025, 52, 0], [2026, 17, 0]];
    const max = 52;
    const years = ydata.map(([y, total, approx]) => {
      const on = this.state.year === y;
      return {
        label: String(y), total,
        aria: y + ': ' + total + ' watches, ' + approx + ' with approximate dates',
        pressed: on ? 'true' : 'false',
        exactH: Math.round(((total - approx) / max) * 132),
        approxH: Math.round((approx / max) * 132),
        fill: on ? accent : 'color-mix(in oklch, ' + accent + ' 45%, #07080C)',
        dash: on ? accent : 'color-mix(in oklch, ' + accent + ' 55%, #07080C)',
        bg: on ? 'rgba(255,255,255,0.06)' : 'transparent',
        border: on ? 'rgba(255,255,255,0.16)' : 'transparent',
        pick: () => this.setState({ year: y })
      };
    });
    const cur = ydata.find((d) => d[0] === this.state.year);
    const idx = ydata.indexOf(cur);
    return {
      accent, months, years,
      year: String(this.state.year),
      yearSummary: cur[1] + ' watches' + (cur[2] ? ' · ' + cur[2] + ' with approximate dates' : '') + (this.state.year === 2026 ? ' · 36.4 hours so far' : ''),
      prev: () => idx > 0 && this.setState({ year: ydata[idx - 1][0] }),
      next: () => idx < ydata.length - 1 && this.setState({ year: ydata[idx + 1][0] })
    };
  }
}
</script>
</body>
</html>
